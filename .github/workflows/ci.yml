name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR feedback only — production deploys happen server-side on zzy_hk
# (push webhook → scripts/server/webhook.mjs → deploy.sh); see
# scripts/server/README.md. GitHub-hosted runners never touch the VPS.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install

      # Spec §6.4 — three invariants.
      - name: Check 1 — catalog integrity
        run: npm run check-catalog
      - name: Check 2 — verification smoke (trimLines + patch + verifyRun over real content)
        run: npm run smoke-verify
      - name: Unit tests
        run: npm test
      - name: Check 3 — version alignment (catalog.zigFloor vs served compiler) + loader pin
        run: npm run check-version-alignment

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Build smoke (the deployed build runs on the server)
        run: npm run build
