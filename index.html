<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziglings Web</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <strong>Ziglings Web</strong>
            <span id="current-exercise" class="current-exercise"></span>
        </div>
        <div class="topbar-center">
            <div class="progress-wrap">
                <span id="progress-count">0/0</span>
                <div class="progress-track"><div id="progress-fill"></div></div>
            </div>
        </div>
        <div class="topbar-right">
            <button type="button" id="export">Export</button>
            <button type="button" id="import">Import</button>
        </div>
    </header>

    <main class="shell">
        <aside class="pane pane-list">
            <nav id="exercise-list" aria-label="Exercises"></nav>
        </aside>

        <section class="pane pane-editor">
            <div id="editor"></div>
        </section>

        <aside class="pane pane-context">
            <div class="context-section">
                <h2>Problem</h2>
                <div id="problem-body"></div>
                <div id="exercise-meta" class="meta"></div>
            </div>
            <hr>
            <div class="context-section">
                <div id="verdict" class="verdict-box"></div>
                <div class="verdict-actions">
                    <button type="button" id="hint" hidden>Show hint</button>
                    <button type="button" id="reveal" hidden>Show official solution</button>
                </div>
                <div class="check-row">
                    <button type="button" id="check">Check</button>
                    <button type="button" id="next" hidden>Next →</button>
                </div>
            </div>
        </aside>
    </main>

    <section class="output-pane">
        <div class="output-header">Output</div>
        <div id="output-pad"></div>
    </section>

    <footer class="attribution">
        Content © Ziglings contributors · Source: codeberg.org/ziglings/exercises
    </footer>

    <script src="/src/shell.ts" type="module"></script>
</body>
</html>
