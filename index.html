<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziglings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style/style.css">
    <!-- Apply persisted sidebar collapse before first paint. Without this the
         sidebar paints expanded then animates shut once boot() applies the
         .collapsed class — a visible layout jump on every reload. -->
    <script>
        if (localStorage.getItem("ziglings:sidebar-collapsed") !== "0") {
            document.documentElement.classList.add("sidebar-collapsed");
        }
    </script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <strong>Ziglings</strong>
        </div>
        <div class="topbar-right">
            <select id="exercise-select" aria-label="Exercise"></select>
            <button type="button" id="run" disabled><span class="run-spinner" aria-hidden="true"></span>Run</button>
            <div class="settings-menu">
                <button type="button" id="settings-toggle" aria-label="Settings" aria-haspopup="dialog">⚙</button>
            </div>
        </div>
    </header>

    <main class="shell">
        <aside class="pane pane-list" id="sidebar">
            <button type="button" id="sidebar-toggle" aria-label="Toggle exercise list"></button>
            <nav id="exercise-list" aria-label="Exercises"></nav>
        </aside>

        <div class="resizer" data-resize="sidebar" role="separator" aria-label="Resize sidebar"></div>

        <section class="pane pane-editor">
            <div id="editor"></div>
            <div id="vim-status" hidden></div>
            <div class="resizer resizer-v" data-resize="solution" role="separator" aria-label="Resize solution" hidden></div>
            <div id="solution-editor" hidden></div>
        </section>

        <div class="resizer" data-resize="context" role="separator" aria-label="Resize context"></div>

        <aside class="pane pane-context">
            <div class="context-verdict">
                <div id="verdict" class="verdict-box"></div>
            </div>
            <section class="output-pane">
                <div id="output-pad"></div>
            </section>
        </aside>
    </main>

    <div id="settings-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-panel">
            <header class="modal-head">
                <h2 id="settings-title">⚙ Settings</h2>
                <button type="button" class="modal-close" data-close aria-label="Close">✕</button>
            </header>
            <div class="modal-body">
                <section class="modal-sec">
                    <h3>Progress</h3>
                    <button type="button" id="export">Export progress</button>
                    <button type="button" id="import">Import progress</button>
                </section>
                <section class="modal-sec">
                    <h3>Shortcuts</h3>
                    <div class="shortcut-list">
                        <div><kbd>F10</kbd><span class="shortcut-desc">Run / Next</span></div>
                        <div><kbd>Ctrl/⌘S</kbd><span class="shortcut-desc">Format code</span></div>
                    </div>
                </section>
                <section class="modal-sec">
                    <h3>Editor</h3>
                    <label class="check-row">
                        <input type="checkbox" id="vim-toggle">
                        <span class="check-label">Vim mode</span>
                        <span class="check-desc">Modal keybindings (hjkl, i, :w)</span>
                    </label>
                </section>
                <section class="modal-sec">
                    <h3>About</h3>
                    <p class="modal-row"><span>Source</span>
                        <a href="https://github.com/xihale/ziglings-web" target="_blank" rel="noopener">github.com/xihale/ziglings-web</a></p>
                    <p class="modal-row"><span>Exercises</span>
                        <a href="https://codeberg.org/ziglings/exercises" target="_blank" rel="noopener">codeberg.org/ziglings/exercises</a></p>
                    <p class="modal-row"><span>License</span><span>MIT</span></p>
                </section>
            </div>
        </div>
    </div>
    <script src="/src/shell.ts" type="module"></script>
</body>
</html>
